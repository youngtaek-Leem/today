<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Gemini 연결 테스트</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #f5f5f5; color: #222; }
    h1 { font-size: 1.2rem; }
    .card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; color: #666; margin: 8px 0 4px; }
    input[type=text], input[type=password] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.9rem; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button { flex: 1; min-width: 140px; padding: 11px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; }
    .primary { background: #7c3aed; color: #fff; }
    .secondary { background: #e5e7eb; color: #333; }
    button:disabled { opacity: 0.5; }
    #log { background: #111; color: #d4ffcb; border-radius: 10px; padding: 12px; font-family: monospace; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all; max-height: 60vh; overflow-y: auto; min-height: 120px; }
    .ok { color: #7CFC00; } .err { color: #ff8080; } .info { color: #9ecfff; }
    .hint { font-size: 0.78rem; color: #666; }
  </style>
</head>
<body>
  <h1>🔧 Gemini 연결 테스트</h1>
  <p class="hint">앱과 같은 방식으로 API를 호출해 원인을 격리합니다. 키는 이 기기(localStorage)에만 저장됩니다.</p>

  <div class="card">
    <label>Gemini API 키</label>
    <input id="key" type="password" placeholder="AIza…" autocomplete="off" />
    <label>모델명 (직접 수정 가능)</label>
    <input id="model" type="text" value="gemini-3.6-flash" />
    <div class="row">
      <button id="btnSave" class="secondary">키 저장</button>
      <button id="btnClear" class="secondary">키 삭제</button>
    </div>
    <p class="hint" id="keyState"></p>
  </div>

  <div class="card">
    <div class="row">
      <button id="t1" class="primary">① 키 검증<br />(모델 목록 조회)</button>
      <button id="t2" class="primary">② 텍스트 생성<br />(모델명 확인)</button>
      <button id="t3" class="primary">③ 사진 포함 생성<br />(실전 경로)</button>
    </div>
    <label>③용 사진 선택 (선택 사항, 최대 1장)</label>
    <input id="photo" type="file" accept="image/*" />
  </div>

  <div class="card">
    <div class="row">
      <button id="btnLogClear" class="secondary">로그 지우기</button>
    </div>
    <div style="height:8px"></div>
    <div id="log">대기 중… 위 버튼을 눌러 테스트하세요.</div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const KEY = 'gemini_api_key';
const logEl = $('log');

function maskKey(k) {
  return k.length > 8 ? k.slice(0, 4) + '…' + k.slice(-4) : '(너무 짧음)';
}
function log(msg, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString('ko-KR')}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}
function getKey() { return (localStorage.getItem(KEY) || '').trim(); }
function refreshKeyState() {
  $('keyState').textContent = getKey() ? '✅ 키 저장됨 (' + maskKey(getKey()) + ')' : '⚠️ 키 없음 — 앱 스토리 탭과 공유됩니다';
}
$('key').value = getKey();
refreshKeyState();

$('btnSave').onclick = () => {
  const v = $('key').value.trim();
  if (!v) { alert('키를 입력하세요'); return; }
  localStorage.setItem(KEY, v);
  refreshKeyState();
  log('키 저장됨: ' + maskKey(v), 'ok');
};
$('btnClear').onclick = () => {
  localStorage.removeItem(KEY);
  $('key').value = '';
  refreshKeyState();
  log('키 삭제됨', 'info');
};
$('btnLogClear').onclick = () => { logEl.textContent = ''; };

function summarizeResponse(bodyText) {
  try {
    const j = JSON.parse(bodyText);
    const c = (j.candidates || [])[0] || {};
    const u = j.usageMetadata || {};
    const len = ((c.content || {}).parts || []).map(p => p.text || '').join('').length;
    return `finishReason=${c.finishReason || '?'} · 응답 ${len}자 · 입력 ${u.promptTokenCount || 0} · 출력 ${u.candidatesTokenCount || 0} 토큰` +
      (c.finishReason && c.finishReason !== 'STOP' ? '  ⚠️ 중간 끊김!' : '');
  } catch { return '(요약 불가)'; }
}
async function readBodySafe(res) {
  const text = await res.text();
  try {
    const pretty = JSON.stringify(JSON.parse(text), null, 1).slice(0, 3000);
    return { pretty, summary: summarizeResponse(text) };
  }
  catch { return { pretty: text.slice(0, 3000), summary: '(요약 불가)' }; }
}

// ① 모델 목록 조회 → 키 유효성 검증 + 사용 가능 모델 확인
$('t1').onclick = async () => {
  const key = getKey();
  if (!key) { alert('키를 먼저 저장하세요'); return; }
  log('① GET /v1beta/models (키 ' + maskKey(key) + ') …', 'info');
  try {
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(key));
    log('상태: HTTP ' + res.status, res.ok ? 'ok' : 'err');
    const body = (await readBodySafe(res)).pretty;
    if (res.ok) {
      const names = [...body.matchAll(/"name":\s*"models\/([^"]+)"/g)].map(m => m[1]);
      const gen = names.filter(n => /flash/i.test(n) && !/image|tts|robot|preview.*exp/i.test(n));
      log('사용 가능 Flash 계열 모델:\n' + (gen.join('\n') || '(없음)'), 'ok');
    } else {
      log('응답 본문:\n' + body, 'err');
      if (res.status === 400) log('→ 키가 잘못되었거나 제한(API 제한·리퍼러 제한) 문제 가능', 'err');
    }
  } catch (e) { log('네트워크 오류: ' + e.message, 'err'); }
};

// ② 텍스트만 생성 → 모델명 유효성 검증
$('t2').onclick = async () => {
  const key = getKey();
  const model = $('model').value.trim();
  if (!key) { alert('키를 먼저 저장하세요'); return; }
  if (!model) { alert('모델명을 입력하세요'); return; }
  log(`② POST /v1beta/models/${model}:generateContent (텍스트만) …`, 'info');
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=` + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [{ text: '한국어로 "연결 성공"이라고만 답하라.' }] }] }),
    });
    log('상태: HTTP ' + res.status, res.ok ? 'ok' : 'err');
    const r2 = await readBodySafe(res);
    log('요약: ' + r2.summary, res.ok ? 'ok' : 'err');
    log('응답 본문:\n' + r2.pretty, res.ok ? 'ok' : 'err');
    if (res.status === 404) log('→ 모델명이 틀렸거나 종료된 모델. ①번 결과의 모델명으로 교체하세요.', 'err');
  } catch (e) { log('네트워크 오류: ' + e.message, 'err'); }
};

// ③ 사진 포함 생성 → 앱과 동일 경로
function loadImage(file, maxDim) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const r = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * r); height = Math.round(height * r);
      }
      const c = document.createElement('canvas');
      c.width = width; c.height = height;
      c.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve({ base64: c.toDataURL('image/jpeg', 0.8).split(',')[1], w: width, h: height });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지 로드 실패')); };
    img.src = url;
  });
}
$('t3').onclick = async () => {
  const key = getKey();
  const model = $('model').value.trim();
  const file = $('photo').files[0];
  if (!key) { alert('키를 먼저 저장하세요'); return; }
  log(`③ 사진 포함 생성 (모델 ${model}) …`, 'info');
  try {
    const parts = [{ text: '이 사진의 분위기를 한 문장으로 설명하라.' }];
    if (file) {
      const img = await loadImage(file, 1024);
      log(`사진 리사이즈: ${img.w}x${img.h}`, 'info');
      parts.push({ inline_data: { mime_type: 'image/jpeg', data: img.base64 } });
    } else {
      log('사진 미선택 → 텍스트만 전송', 'info');
    }
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=` + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts }], generationConfig: { temperature: 0.8, maxOutputTokens: 4096 } }),
    });
    log('상태: HTTP ' + res.status, res.ok ? 'ok' : 'err');
    const r3 = await readBodySafe(res);
    log('요약: ' + r3.summary, res.ok ? 'ok' : 'err');
    log('응답 본문:\n' + r3.pretty, res.ok ? 'ok' : 'err');
  } catch (e) { log('오류: ' + e.message, 'err'); }
};
</script>
</body>
</html>
